<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Swarmsite</title><meta name="robots" content="noindex">
<link rel="preload" href="/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Instrument Sans';font-weight:400;font-display:swap;src:url(/fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-display:swap;src:url(/fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
:root{--paper:#F5F5F4;--ink:#111;--muted:#6B6B68;--line:rgba(17,17,17,.12);--sans:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr}
a{color:inherit}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}.brand{font-weight:500;letter-spacing:-.02em;text-decoration:none}.lab{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
main{display:grid;place-items:center;padding:24px 20px 80px}.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,36px);display:grid;gap:18px;box-shadow:0 25px 70px rgba(17,17,17,.06)}
h1{font-weight:400;font-size:clamp(26px,4vw,34px);line-height:1.1;letter-spacing:-.025em}p{color:var(--muted)}
label{font-size:13px;font-weight:500}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;background:#fff}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border-radius:999px;border:1px solid var(--line);background:#fff;font:500 15px var(--sans);cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1)}.pill.ink{background:var(--ink);color:#fff;border-color:var(--ink)}.pill:hover{transform:translateY(-1px)}.pill:active{transform:scale(.98)}.pill[disabled]{opacity:.5;cursor:default;transform:none}
.or{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";height:1px;background:var(--line)}
.stack{display:grid;gap:10px}.note{font-size:14px;min-height:1.5em}.note.err{color:#b3261e}.fine{font-size:13px}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/">swarmsite</a><span class="lab">sign in</span></div>
<main><div class="card">
  <div><h1>Sign in to keep your designs</h1><p>Your previews, the designs you chose and what you bought stay in one place.</p></div>
  <div class="stack" id="providers"></div>
  <div class="or" id="or" hidden>or</div>
  <form class="stack" id="byEmail" hidden onsubmit="return false">
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" placeholder="you@company.com" required>
    <button class="pill ink" id="send">Send me a sign-in link</button>
  </form>
  <p class="note" id="note" role="status" aria-live="polite"></p>
  <p class="fine" id="off" hidden>Accounts are not switched on for this site yet. You can still <a href="/app">start a preview</a>.</p>
  <p class="fine">By signing in you accept the <a href="/terms">terms</a> and the <a href="/privacy">privacy notice</a>.</p>
</div></main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/auth.js"></script>
<script>
const $ = s => document.querySelector(s); const next = Auth.safeNext(new URLSearchParams(location.search).get('next'));
const say = (text, bad) => { const n = $('#note'); n.textContent = text; n.classList.toggle('err', !!bad); };
const NAMES = { github: 'Continue with GitHub', google: 'Continue with Google' };
(async () => {
  if (!Auth.enabled) { $('#off').hidden = false; return; }
  if (await Auth.session()) { location.replace(next); return; }
  Auth.onChange(s => { if (s) location.replace(next); });   // arriving from the link in the e-mail, or back from GitHub or Google
  const providers = Auth.methods.filter(m => NAMES[m]);
  for (const p of providers) { const b = document.createElement('button'); b.className = 'pill'; b.type = 'button'; b.textContent = NAMES[p]; b.onclick = async () => { say('Opening ' + p + '…'); const { error } = await Auth.signInWith(p, next); if (error) say('That did not work: ' + String(error.message || error).slice(0, 120), true); }; $('#providers').appendChild(b); }
  if (Auth.methods.includes('email')) { $('#byEmail').hidden = false; $('#or').hidden = providers.length === 0; }
  $('#send').onclick = async () => { const email = $('#email').value.trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say('That does not look like an e-mail address.', true); return; }
    $('#send').disabled = true; say('Sending…'); const { error } = await Auth.signInEmail(email, next);
    if (error) { say('We could not send the link: ' + String(error.message || error).slice(0, 120), true); $('#send').disabled = false; } else say('Check ' + email + ' — the link signs you in on this device.'); };
})();
</script>
</body>
</html>
