<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarmsite — rebuilding your site</title><meta name="robots" content="noindex">
<link rel="preload" href="/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Instrument Sans';font-weight:400;font-display:swap;src:url(/fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-display:swap;src:url(/fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
:root{--paper:#F5F5F4;--ink:#111;--muted:#6B6B68;--line:rgba(17,17,17,.12);--panel:#141414;--sans:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.lab{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:12px}
.top .grp{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px}
.top .brand{font-weight:500;letter-spacing:-.02em;padding-right:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;border:1px solid var(--line);background:#fff;min-height:40px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pill.ink{background:var(--ink);color:#fff;border-color:var(--ink)}.pill:hover{transform:translateY(-2px)}.pill:active{transform:scale(.97);transition:transform 100ms ease-out}
/* stage */
.stage{min-height:100svh;display:grid;align-content:center;justify-items:center;padding:96px 20px 40px;gap:26px;text-align:center}
.h{font-weight:400;font-size:clamp(28px,4vw,48px);line-height:1.08;letter-spacing:-.025em;max-width:20ch}
.url{font-family:var(--mono);font-size:13px;color:var(--muted)}
.frame{width:min(1100px,94vw);aspect-ratio:16/9;background:var(--panel);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 40px 100px rgba(17,17,17,.18)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top;opacity:.0;transition:opacity .8s}
.frame img.in{opacity:.55}
.frame .skel{position:absolute;inset:0;background:linear-gradient(100deg,#1a1a1a 20%,#222 40%,#1a1a1a 60%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.frame .hud{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));color:#fff;display:flex;justify-content:space-between;align-items:end;gap:16px;text-align:left}
.frame .hud .lab{color:rgba(255,255,255,.7)}
.cur{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:left 1.2s cubic-bezier(.2,.8,.2,1),top 1.2s cubic-bezier(.2,.8,.2,1)}
.cur::after{content:attr(data-n);position:absolute;left:18px;top:-6px;transform:rotate(45deg);font:500 10px var(--sans);color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;white-space:nowrap}
.steps{width:min(720px,94vw);display:grid;gap:0;text-align:left;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line);font-size:15px}
.step:first-child{border-top:0}.step .dot{width:10px;height:10px;border-radius:50%;background:#D8D8D5;justify-self:center}
.step.running .dot{background:var(--ink);animation:pulse 1.2s infinite}.step.done .dot{background:#1F9D55}.step.failed .dot{background:#D9424A}
.step .note{font-family:var(--mono);font-size:11px;color:var(--muted)}
@keyframes pulse{50%{transform:scale(.6);opacity:.4}}
.micro{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
/* result */
.result{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column}
.result.on{display:flex}
.result iframe{flex:1;border:0;width:100%;background:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;flex-wrap:wrap}
.bar .l{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:#fff;padding:8px 14px;font:500 13px var(--sans);cursor:pointer;min-height:40px}.seg button.on{background:var(--ink);color:#fff}
.err{color:#D9424A;max-width:60ch}
@media(max-width:700px){.frame{aspect-ratio:3/4}.top .brand span{display:none}.bar{padding:10px 12px}}
</style>
</head>
<body>
<div class="top"><div class="grp"><a class="brand" href="/">Swarmsite <span class="lab">· live rebuild</span></a></div><div class="grp"><a class="pill" href="/">New URL</a></div></div>

<section class="stage" id="stage">
  <span class="lab" id="urlLab"></span>
  <h1 class="h" id="h">Reading your site…</h1>
  <div class="frame" id="frame"><div class="skel" id="skel"></div><img id="before" alt=""><div class="hud"><span class="lab" id="hudL">agents waking up</span><span class="lab" id="hudR">0 / 6</span></div></div>
  <div class="steps" id="steps"></div>
  <div class="micro"><span class="lab">5–15 minutes · stay or come back, this page remembers the job</span></div>
  <p class="err" id="err"></p>
</section>

<div class="result" id="result">
  <iframe id="preview" title="Your rebuilt site"></iframe>
  <div class="bar">
    <div class="l"><span class="lab" id="meta"></span><div class="seg"><button class="on" data-v="desktop">Desktop</button><button data-v="mobile">Phone</button></div></div>
    <div class="l"><a class="pill" id="openNew" target="_blank" rel="noopener">Open full screen ↗</a><a class="pill ink" href="/#paths">Keep it →</a></div>
  </div>
</div>

<script src="/config.js"></script>
<script>
const API = window.SWARMSITE_API; const qs = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const NAMES = ['Audit','Concept','Copy','Type','Photos','Motion','QA','Ending'];
let cursors = [];
function spawnCursors(){ const f = $('#frame'); NAMES.forEach((n,i)=>{ const c=document.createElement('i'); c.className='cur'; c.dataset.n=n; c.style.background=['#10B981','#E63946','#1D5CFF','#FDCB40','#A8FFCB','#FF2E8A','#F4F4F4','#B89B62'][i]; c.style.left=(10+Math.random()*80)+'%'; c.style.top=(10+Math.random()*70)+'%'; f.appendChild(c); cursors.push(c); }); setInterval(()=>cursors.forEach(c=>{ c.style.left=(6+Math.random()*86)+'%'; c.style.top=(8+Math.random()*74)+'%'; }), 1500); }
function renderSteps(job){ const el=$('#steps'); el.innerHTML=job.steps.map(s=>`<div class="step ${s.status}"><span class="dot"></span><span>${s.label}</span><span class="note">${s.status==='done'?(s.note||'done'):s.status==='running'?'working…':''}</span></div>`).join('');
  const done=job.steps.filter(s=>s.status==='done').length; $('#hudR').textContent=`${done} / ${job.steps.length}`; const cur=job.steps.find(s=>s.status==='running'); $('#hudL').textContent=cur?cur.label.toLowerCase():(job.status==='done'?'done':'queued'); $('#h').textContent=cur?cur.label.split(':')[0]+'…':(job.status==='queued'?'In the queue…':'Reading your site…');
  if(job.result?.beforeUrl && !$('#before').src){ $('#before').src=job.result.beforeUrl; $('#before').onload=()=>{ $('#before').classList.add('in'); $('#skel').remove(); }; } }
function showResult(job){ const r=job.result; const pv=`${window.SWARMSITE_API}/p/${job.id}`; $('#preview').src=pv; $('#openNew').href=pv; $('#meta').textContent=`${r.direction?.kind||''} · concept ${r.direction?.concept||''} · ${r.direction?.beats?.length||''} beats · ${r.seconds||''}s`; $('#result').classList.add('on');
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const f=$('#preview'); if(b.dataset.v==='mobile'){ f.style.width='390px'; f.style.margin='0 auto'; f.style.borderLeft=f.style.borderRight='1px solid #ddd'; } else { f.style.width='100%'; f.style.border='0'; } }); }
async function poll(id){ try{ const r=await fetch(`${API}/jobs/${id}`); if(!r.ok) throw new Error('job not found'); const job=await r.json(); renderSteps(job);
    if(job.status==='done'){ showResult(job); return; } if(job.status==='failed'){ $('#err').textContent='Something broke: '+(job.error||'unknown')+'. Try again or send us the URL.'; $('#h').textContent='That one didn’t go through.'; return; }
  }catch(e){ $('#err').textContent=e.message; } setTimeout(()=>poll(id), 3000); }
async function start(){ let id=qs.get('job'); const url=qs.get('url'); $('#urlLab').textContent=url?('https://'+url.replace(/^https?:\/\//,'')):''; spawnCursors();
  if(!id && url){ const r=await fetch(`${API}/jobs`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})}); const j=await r.json(); if(!r.ok){ $('#err').textContent=j.error||'could not start'; return; } id=j.id; history.replaceState(null,'',`/app?url=${encodeURIComponent(url)}&job=${id}`); }
  if(!id){ location.href='/'; return; } poll(id); }
start();
</script>
</body></html>
