<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your projects — Swarmsite</title><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&amp;family=Figtree:wght@400;500;600;700&amp;family=Shrikhand&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/header.css">
<style>
/* The dashboard: what a signed-in visitor has made, and where the next one starts. Each project is a card in the manner
   of the chooser — the covers of its designs, its name, where it stands in plain words, and the two things done with it:
   open its designs, edit the one chosen. Starting a project offers the same three ways in as the front page.
   Tokens, type, buttons and the address field: /css/site.css. */
:root{--line:rgba(20,20,20,.12);--bad:#a3261b}
[hidden]{display:none!important}
main{width:min(1240px,100%);margin:0 auto;padding:128px 24px 96px;display:grid;gap:40px}
main :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
h1{font:400 75px/1 var(--serif);letter-spacing:-.03em}
.lab{font:500 14px/1.3 var(--sans);color:var(--muted)}
.meter{display:grid;gap:8px;min-width:220px}.meter i{display:block;height:6px;border-radius:99px;background:var(--card);overflow:hidden}.meter i b{display:block;height:100%;background:var(--ink);border-radius:99px}
.start{background:var(--card);border-radius:32px;padding:16px}.start>div{background:var(--paper);border-radius:16px;padding:28px;display:grid;gap:16px;justify-items:start}
.start h2{font:400 36px/1 var(--serif);letter-spacing:-.03em}.start .ways{margin-inline:0}.start .urlf{margin-inline:0;max-width:640px}
.help{font-size:15px;color:var(--muted)}.help.err{color:var(--bad)}
.sub{font:400 36px/1 var(--serif);letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.proj{display:grid;gap:0;background:var(--card);border-radius:32px;padding:16px;border:2px solid transparent;transition:border-color .3s}.proj:hover{border-color:var(--ink)}
.card{display:grid;gap:0;color:inherit}
/* each cover whole, in its own proportion (16:10): the first large, the other two beside it */
.covers{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.cv{aspect-ratio:16/10;border-radius:10px;background:var(--paper) top center/cover no-repeat}.cv.main{grid-row:1/3;aspect-ratio:auto;min-height:100%;border-radius:16px}.covers.one{grid-template-columns:1fr}.covers.one .cv.main{grid-row:auto;aspect-ratio:16/10}
.cv.none{display:grid;place-items:center;font-size:14px;color:var(--muted)}
.body{display:grid;gap:8px;padding:18px 8px 6px}.site{font:400 30px/1 var(--serif);letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2)}.state.done::before{background:var(--ink)}.state.running::before,.state.queued::before{background:var(--deep);animation:pulse 1.4s ease-in-out infinite}.state.failed::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 8px 4px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:8px;border:2px solid var(--ink);background:transparent;font:600 15px/1 var(--sans);color:var(--ink);white-space:nowrap;cursor:pointer;transition:transform .2s}.pill:hover{transform:scale(.98)}.pill.ink{background:var(--accent)}
.paid{margin-left:auto;padding:6px 12px;border-radius:999px;background:var(--ground);font:600 13px/1.2 var(--sans);box-shadow:inset 0 0 0 2px var(--ink)}
.empty{background:var(--card);border-radius:32px;padding:16px}.empty span{display:block;background:var(--paper);border-radius:16px;padding:28px;font-size:18px}
.note{color:var(--muted)}.note.err{color:var(--bad)}
@media(max-width:991px){main{padding:96px 16px 72px;gap:28px}h1{font-size:44px}.start{border-radius:20px;padding:8px}.start>div{padding:20px}.start h2,.sub{font-size:30px}.proj{border-radius:24px;padding:10px}.site{font-size:26px}}
@media(prefers-reduced-motion:reduce){.state::before{animation:none!important}.proj,.pill{transition:none}}
</style>
</head>
<body>
<header class="hd" data-hd data-hd-page="dashboard"><div class="hd-grp"><a class="hd-brand" href="/" aria-label="Swarmsite, front page">swarmsite</a><a class="hd-item hd-wide" data-hd-projects href="/dashboard" hidden>Projects</a></div><div class="hd-grp" data-hd-right><a class="hd-cta" href="#new">New project</a></div></header>
<main>
  <div class="head"><h1>Your <em>projects</em></h1><div class="meter" id="meter" hidden><span class="lab" id="meterText"></span><i><b id="meterBar"></b></i></div></div>
  <section class="start" aria-labelledby="startH"><div>
    <h2 id="startH">Start a project</h2>
    <div class="ways" role="tablist" aria-label="How do you want to start?"><button type="button" role="tab" data-way="site" aria-selected="true">I have a site</button><button type="button" role="tab" data-way="app" aria-selected="false">I built a first version of my app</button><button type="button" role="tab" data-way="none" aria-selected="false">I don’t have a site</button></div>
    <form class="urlf" id="new" onsubmit="return false" novalidate><span class="pre" aria-hidden="true">https://</span><input id="site" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="yourwebsite.com" aria-label="The address of your site" aria-describedby="newHelp"><button class="btn" id="go" type="submit">Get three designs</button></form>
    <a class="btn" id="formGo" href="/start" hidden>Start the short form</a>
    <p class="help" id="newHelp">Paste the address of a site. The designs start at once and are kept here.</p>
  </div></section>
  <h2 class="sub" id="listHead" hidden>Saved projects</h2>
  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden><span>No projects yet. Your first one appears here when you start it.</span></p>
  <p class="note" id="note" role="status"></p>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/header.js"></script>
<script>
const $ = s => document.querySelector(s);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return String(u || '').slice(0, 60); } };
const when = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); };
const STATE = { done: 'Ready', running: 'Working', queued: 'In the queue', failed: 'Did not finish' };
const safe = u => typeof u === 'string' && /^https:\/\//.test(u) ? 'url("' + u.replace(/["\\\n()]/g, '') + '")' : '';
/* a project: the covers of its designs (the picture of the old page for an older project), its name, where it stands, and
   what is done with it. Built with the DOM, never with markup: an address or a name is whatever its owner typed. */
function card(j) {
  const proj = document.createElement('div'); proj.className = 'proj';
  const a = document.createElement('a'); a.className = 'card'; a.href = '/app?job=' + encodeURIComponent(j.id) + '&url=' + encodeURIComponent(j.url || '');
  const cs = (j.covers || []).filter(c => safe(c.cover)).slice(0, 3), covers = document.createElement('div'); covers.className = 'covers' + (cs.length < 3 ? ' one' : '');
  const tile = (bg, cls) => { const d = document.createElement('div'); d.className = 'cv ' + cls; if (bg) d.style.backgroundImage = bg; return d; };
  if (cs.length >= 3) covers.append(tile(safe(cs[0].cover), 'main'), tile(safe(cs[1].cover), ''), tile(safe(cs[2].cover), ''));
  else if (cs.length) covers.append(tile(safe(cs[0].cover), 'main'));
  else if (safe(j.before)) covers.append(tile(safe(j.before), 'main'));
  else { const d = tile('', 'main none'); d.textContent = STATE[j.status] || j.status; covers.append(d); }
  const body = document.createElement('div'); body.className = 'body'; const site = document.createElement('div'); site.className = 'site'; site.textContent = j.name || host(j.url);
  const row = document.createElement('div'); row.className = 'row'; const st = document.createElement('span'); st.className = 'state ' + (STATE[j.status] ? j.status : ''); st.textContent = (STATE[j.status] || j.status) + (j.status === 'done' && j.designs ? ' · ' + j.designs + (j.designs === 1 ? ' design' : ' designs') : '');
  const date = document.createElement('span'); date.className = 'lab'; date.textContent = when(j.created_at); row.append(st, date); body.append(site, row); a.append(covers, body); proj.appendChild(a);
  const acts = document.createElement('div'); acts.className = 'acts'; const link = (t, href, cls) => { const l = document.createElement('a'); l.className = 'pill' + (cls || ''); l.href = href; l.textContent = t; return l; };
  acts.append(link(j.status === 'done' ? 'Open designs' : j.status === 'failed' ? 'See what happened' : 'See it work', a.href, ''));
  const which = (j.paid || [])[0] || (j.covers || [])[0]?.id;
  if (j.editable && /^v[1-9][0-9]?$/.test(which || '')) acts.append(link('Edit', '/edit?job=' + encodeURIComponent(j.id) + '&slug=' + which, ' ink'));
  if ((j.paid || []).length) { const p = document.createElement('span'); p.className = 'paid'; p.textContent = 'Paid · Design ' + String(j.paid[0]).slice(1); acts.append(p); }
  proj.appendChild(acts); return proj;
}
async function load() {
  const [me, jobs] = await Promise.all([Auth.api('/me'), Auth.api('/me/jobs')]);
  if (me.status === 401 || jobs.status === 401) { location.replace('/login?next=' + encodeURIComponent('/dashboard')); return; }
  if (!me.ok || !jobs.ok) throw new Error('unavailable');
  const who = await me.json(), list = await jobs.json();
  if (who.previews && who.previews.free) { $('#meter').hidden = false; $('#meterText').textContent = who.previews.used + ' of ' + who.previews.free + ' free previews used'; $('#meterBar').style.width = Math.min(100, Math.round(100 * who.previews.used / who.previews.free)) + '%'; }
  $('#grid').replaceChildren(...list.map(card)); $('#empty').hidden = list.length > 0; $('#listHead').hidden = list.length === 0;
  if (list.some(j => j.status === 'running' || j.status === 'queued')) setTimeout(() => load().catch(() => {}), 15000);   // a working project updates by itself
}
/* Starting a project: the same three ways in as the front page. An address goes straight to the designs; a first version of
   an app goes by way of its screenshots; no site, the short form. */
let way = 'site'; const HELP = { site: 'Paste the address of a site. The designs start at once and are kept here.', app: 'Paste its address. Next you add up to six screenshots of your app.', none: 'One short form about your business, with your own photographs.' };
document.querySelectorAll('.ways [data-way]').forEach((b, i, all) => { const pick = () => { way = b.dataset.way; all.forEach(x => { x.setAttribute('aria-selected', String(x === b)); x.tabIndex = x === b ? 0 : -1; }); $('#new').hidden = way === 'none'; $('#formGo').hidden = way !== 'none'; $('#newHelp').textContent = HELP[way]; $('#newHelp').classList.remove('err'); };
  b.onclick = pick; b.tabIndex = i ? -1 : 0; b.addEventListener('keydown', e => { const k = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0; if (!k) return; e.preventDefault(); const n = all[(i + k + all.length) % all.length]; n.click(); n.focus(); }); });
const startNew = () => { const raw = $('#site').value.trim().replace(/^https?:\/\//i, '').replace(/\s+/g, ''); const help = $('#newHelp');
  if (!/^[^\s/]+\.[^\s/]{2,}/.test(raw)) { help.textContent = 'Type the address of a site, for example yoursite.com.'; help.classList.add('err'); $('#site').focus(); return; }
  location.href = '/app?url=' + encodeURIComponent(raw) + (way === 'app' ? '&with=screens' : ''); };
$('#go').onclick = startNew; $('#site').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startNew(); } });
document.addEventListener('click', e => { if (!e.target.closest('.hd a[href="#new"]')) return; e.preventDefault(); $('#new').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#site').focus({ preventScroll: true }); });   // "New project", in the header or in the account panel
if (location.hash === '#new') setTimeout(() => $('#site').focus(), 60);
(async () => {
  if (!Auth.enabled) { $('#note').textContent = 'Accounts are not switched on for this site yet.'; return; }
  if (!(await Auth.session())) { location.replace('/login?next=' + encodeURIComponent('/dashboard')); return; }
  try { await load(); } catch (e) { $('#note').textContent = 'Your projects could not be loaded. Try again in a moment.'; $('#note').classList.add('err'); }
})();
</script>
</body>
</html>
