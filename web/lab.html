<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swarmsite · lab — swarm v2</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0f0f0f;color:#eee;font:14px/1.5 Inter,system-ui,sans-serif}
.top{display:flex;gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#0f0f0f;z-index:9}
.top b{font-weight:500}.top .seg{display:flex;gap:4px;background:#1c1c1c;border-radius:999px;padding:3px}.top .seg button{border:0;background:transparent;color:#999;padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}.top .seg button.on{background:#fff;color:#111}
.top label{color:#888;font-size:12px;display:flex;gap:6px;align-items:center}
.stage{position:relative;width:1200px;max-width:calc(100% - 40px);height:760px;margin:24px auto;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.stage img{display:block;width:100%;will-change:transform}
.log{width:1200px;max-width:calc(100% - 40px);margin:0 auto 40px;font:12px/1.6 ui-monospace,Menlo,monospace;color:#8a8a8a;display:grid;gap:2px}
.log div b{color:#ddd;font-weight:500;display:inline-block;width:80px}
</style></head><body>
<div class="top"><b>Swarmsite lab · swarm v2 (premium cursors)</b>
<div class="seg" id="shape"><button data-sh="arrow">Cursor</button><button data-sh="firefly" class="on">Firefly</button></div>
<div class="seg" id="spd"><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div>
<label><input type="checkbox" id="replay" checked> replay the real Bálamo job</label>
<label><input type="checkbox" id="only"> only real events (no idle drift)</label></div>
<div class="stage" id="stage"><img id="shot" alt=""></div>
<div class="log" id="log"></div>
<script src="/js/swarm2.js"></script>
<script>
const JOB = 'https://swarmsite-production.up.railway.app/jobs/abf8fe2c-1db8-48f8-a6d3-64c32f3d2721';
const stage = document.getElementById('stage'), shot = document.getElementById('shot'), log = document.getElementById('log');
let speed = 1; document.getElementById('spd').onclick = e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.s; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); };
(async () => {
  const j = await (await fetch(JOB)).json(); const ev = (j.result && j.result.events) || [];
  shot.src = (j.result && (j.result.beforeFullUrl || j.result.beforeUrl)) || '';
  await new Promise(r => { shot.onload = r; });
  const q = new URLSearchParams(location.search); let shape = q.get('shape') || 'firefly'; [...document.querySelectorAll('#shape button')].forEach(b => b.classList.toggle('on', b.dataset.sh === shape));
  let sw = Swarm2.mount(stage, { count: 9, shape }); sw.setPage(shot, shot.naturalHeight);
  document.getElementById('shape').onclick = e => { const b = e.target.closest('button'); if (!b) return; location.search = '?shape=' + b.dataset.sh; };
  const seq = ev.filter(e => e.rect && e.rect.w > 20 || /Reader|Concept|Copy|Critic|Contract|UX|UI|Visual/.test(e.role));
  let i = 0; const next = () => { if (!document.getElementById('replay').checked) return setTimeout(next, 800); const e = seq[i % seq.length]; i++; sw.push([e]);
    const d = document.createElement('div'); d.innerHTML = `<b>${e.role}</b>${e.text}`; log.prepend(d); while (log.children.length > 14) log.lastChild.remove(); setTimeout(next, (e.rect ? 3200 : 1600) / speed); }; next();
})();
</script></body></html>
