<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swarmsite · lab — 3D swarm</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#0e0e0e;--paper:#f3efe7;--line:rgba(0,0,0,.12)}
*{box-sizing:border-box}html,body{margin:0;background:#121212;color:#eee;font:14px/1.5 "Inter Tight",Inter,system-ui,sans-serif}
.top{display:flex;gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#121212;z-index:5}
.top b{font-weight:500;letter-spacing:.02em}.top .seg{display:flex;gap:4px;background:#1c1c1c;border-radius:999px;padding:3px}
.top .seg button{border:0;background:transparent;color:#999;padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}.top .seg button.on{background:#fff;color:#111}
.top label{color:#888;font-size:12px}.top input[type=range]{width:120px}
.stage{position:relative;width:1200px;max-width:calc(100% - 40px);margin:24px auto;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.page{position:relative;width:100%}.page img{display:block;width:100%}
canvas.gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tags{position:absolute;inset:0;pointer-events:none}.tag{position:absolute;transform:translate(-50%,-100%);font:500 11px/1 Inter,system-ui;letter-spacing:.06em;text-transform:uppercase;color:#111;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid rgba(0,0,0,.08);padding:5px 8px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .25s}
.tag.on{opacity:1}.tag i{font-style:normal;color:#777;text-transform:none;letter-spacing:0;margin-left:6px;font-weight:400}
.mark{position:absolute;border:1.5px solid rgba(255,80,80,.9);border-radius:6px;opacity:0;transition:opacity .3s}.mark.on{opacity:1}
.hud{position:fixed;right:18px;top:70px;width:240px;background:rgba(20,20,20,.85);backdrop-filter:blur(10px);border:1px solid #2a2a2a;border-radius:12px;padding:10px 12px;font-size:12px;z-index:5}
.hud div{display:flex;gap:8px;align-items:center;padding:4px 0;color:#bbb}.hud div.on{color:#fff}.hud s{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;text-decoration:none}.hud div.on s{background:#A3E635}
.note{color:#777;font-size:12px;text-align:center;margin:0 0 30px}
</style></head><body>
<div class="top"><b>Swarmsite lab · 3D swarm</b>
<div class="seg" id="mat"><button data-m="graphite" class="on">Graphite</button><button data-m="brass">Brass</button><button data-m="glass">Glass</button><button data-m="ceramic">Ceramic</button></div>
<div class="seg" id="spd"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
<label>light <input type="range" id="light" min="0" max="2" step=".05" value="1"></label>
<label><input type="checkbox" id="replay" checked> replay real job</label></div>
<div class="stage"><div class="page"><img id="shot" alt="" crossorigin="anonymous"><canvas class="gl" id="gl"></canvas><div class="tags" id="tags"></div></div></div>
<div class="hud" id="hud"></div>
<p class="note">Bálamo · real events from a real job · agents are 3D bodies with contact shadows; labels stay HTML</p>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"}}</script>
<script type="module">
import * as T from 'three';
const JOB = 'https://swarmsite-production.up.railway.app/jobs/abf8fe2c-1db8-48f8-a6d3-64c32f3d2721';
const ROLES = { Reader: 'lens', Concept: 'prism', UX: 'torus', Copy: 'stylus', UI: 'cube', Visual: 'ring', Critic: 'core', Contract: 'seal', Render: 'roller', Type: 'stylus', Audit: 'lens', Photos: 'ring', Motion: 'torus', QA: 'core', Ending: 'seal' };
const NAMES = ['Reader', 'Concept', 'UX', 'Copy', 'UI', 'Visual', 'Critic', 'Contract', 'Render'];
const MATS = {
  graphite: () => new T.MeshStandardMaterial({ color: 0x2a2a2e, metalness: .85, roughness: .35 }),
  brass: () => new T.MeshStandardMaterial({ color: 0xc9a24a, metalness: 1, roughness: .28 }),
  glass: () => new T.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: .08, transmission: .9, thickness: 1.2, ior: 1.45, transparent: true }),
  ceramic: () => new T.MeshStandardMaterial({ color: 0xf1ede6, metalness: 0, roughness: .55 })
};
const GEO = {
  lens: () => new T.CylinderGeometry(16, 16, 5, 48), prism: () => new T.ConeGeometry(14, 30, 4), torus: () => new T.TorusGeometry(13, 4.5, 24, 48),
  stylus: () => new T.CylinderGeometry(3, 6, 36, 24), cube: () => new T.BoxGeometry(22, 22, 22), ring: () => new T.TorusGeometry(15, 2.5, 16, 64),
  core: () => new T.SphereGeometry(14, 48, 32), seal: () => new T.CylinderGeometry(13, 13, 18, 48), roller: () => new T.CylinderGeometry(9, 9, 34, 32)
};
const shot = document.getElementById('shot'), page = document.querySelector('.page'), cv = document.getElementById('gl'), tags = document.getElementById('tags'), hud = document.getElementById('hud');
let W = 1200, H = 800, scale = 1; // page px → css px scale (screenshot is 1440 wide)
const renderer = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap; renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setClearColor(0x000000, 0);
const scene = new T.Scene(); const cam = new T.OrthographicCamera(0, 1, 0, -1, 1, 4000); cam.position.set(0, 0, 2000); cam.lookAt(0, 0, 0);
const key = new T.DirectionalLight(0xffffff, 1.6); key.position.set(-300, -500, 900); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
const fill = new T.HemisphereLight(0xffffff, 0x8a8a8a, .9); scene.add(fill);
const pmrem = new T.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnv(), .04).texture;
function RoomEnv() { const s = new T.Scene(); const m = new T.MeshBasicMaterial({ color: 0xffffff }); const box = new T.Mesh(new T.BoxGeometry(1, 1, 1), new T.MeshBasicMaterial({ color: 0x888888, side: T.BackSide })); s.add(box); for (const [x, y, z, w, h] of [[-.3, .4, .4, .4, .2], [.3, .4, .4, .4, .2], [0, -.1, .45, .8, .1]]) { const p = new T.Mesh(new T.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.lookAt(0, 0, 0); s.add(p); } return s; }
const ground = new T.Mesh(new T.PlaneGeometry(1, 1), new T.ShadowMaterial({ opacity: .28 })); ground.receiveShadow = true; scene.add(ground);
const agents = {}; let matName = 'graphite';
function mkAgent(name) { const m = new T.Mesh(GEO[ROLES[name] || 'core'](), MATS[matName]()); m.castShadow = true; m.rotation.x = .9; const px = 70 + NAMES.indexOf(name) * 46; m.userData = { name, x: px, y: -80, z: 90, tx: px, ty: 38, tz: 90, phase: 'idle', spin: Math.random() * 6 }; scene.add(m);
  const tag = document.createElement('div'); tag.className = 'tag'; tag.innerHTML = `${name}<i></i>`; tags.appendChild(tag); m.userData.tag = tag;
  const h = document.createElement('div'); h.innerHTML = `<s></s>${name} <span style="margin-left:auto;color:#777"></span>`; hud.appendChild(h); m.userData.hud = h; agents[name] = m; return m; }
NAMES.forEach(mkAgent);
function fit() { W = page.clientWidth; H = page.clientHeight; scale = W / 1440; renderer.setSize(W, H, false); cam.left = 0; cam.right = W; cam.top = 0; cam.bottom = -H; cam.updateProjectionMatrix(); ground.scale.set(W * 2, H * 2, 1); ground.position.set(W / 2, -H / 2, 0); key.position.set(W * .3, -H * .2, 900); key.target.position.set(W * .5, -H * .5, 0); scene.add(key.target); key.shadow.camera.left = -W; key.shadow.camera.right = W; key.shadow.camera.top = H; key.shadow.camera.bottom = -H; key.shadow.camera.near = 1; key.shadow.camera.far = 3000; key.shadow.camera.updateProjectionMatrix(); }
shot.onload = fit; addEventListener('resize', fit);
fetch(JOB).then(r => r.json()).then(j => { shot.src = (j.result && (j.result.beforeFullUrl || j.result.beforeUrl)) || ''; });
// ───────── motion: lift, travel on an arc, settle, work, lift
function goto(name, rect, text, dur = 1400) { const a = agents[name] || mkAgent(name); const u = a.userData; const cx = (rect.x + rect.w / 2) * scale, cy = (rect.y + Math.min(rect.h, 220) / 2) * scale; u.fx = u.x; u.fy = u.y; u.tx = cx; u.ty = cy; u.t0 = performance.now(); u.dur = dur / speed; u.phase = 'travel'; u.text = text; u.tag.querySelector('i').textContent = text; u.tag.classList.add('on'); u.hud.classList.add('on'); u.hud.querySelector('span').textContent = text.slice(0, 26); mark(rect, name === 'Critic' || name === 'Contract'); }
function idle(name) { const a = agents[name]; if (!a) return; const u = a.userData; u.phase = 'idle'; u.tag.classList.remove('on'); u.hud.classList.remove('on'); u.tz = 90; u.tx = 70 + NAMES.indexOf(name) * 46; u.ty = 38; }
let marks = []; function mark(rect, red) { if (!red) return; const d = document.createElement('div'); d.className = 'mark'; d.style.cssText = `left:${rect.x * scale}px;top:${rect.y * scale}px;width:${rect.w * scale}px;height:${rect.h * scale}px`; tags.appendChild(d); requestAnimationFrame(() => d.classList.add('on')); setTimeout(() => { d.classList.remove('on'); setTimeout(() => d.remove(), 400); }, 2600 / speed); }
let speed = 1, light = 1;
function tick(now) { for (const a of Object.values(agents)) { const u = a.userData;
    if (u.phase === 'travel') { const k = Math.min(1, (now - u.t0) / u.dur); const e = 1 - Math.pow(1 - k, 3); u.x = u.fx + (u.tx - u.fx) * e; u.y = u.fy + (u.ty - u.fy) * e; u.z = 90 + Math.sin(k * Math.PI) * 120; if (k >= 1) { u.phase = 'work'; u.t1 = now; } }
    else if (u.phase === 'work') { const k = (now - u.t1) / (2200 / speed); u.z = 18 + Math.sin(now / 260) * 3; u.x = u.tx + Math.sin(now / 300 + u.spin) * (u.name === 'Reader' ? 18 : 4); if (k > 1) idle(u.name); }
    else { u.x += (u.tx - u.x) * .05; u.y += (u.ty - u.y) * .05; u.z += (u.tz + Math.sin(now / 900 + u.spin) * 10 - u.z) * .05; }
    a.position.set(u.x, -u.y, u.z); a.rotation.z += u.phase === 'work' ? .02 : .006; a.rotation.y = Math.sin(now / 1400 + u.spin) * .2;
    u.tag.style.left = u.x + 'px'; u.tag.style.top = (u.y - 26) + 'px'; }
  renderer.render(scene, cam); requestAnimationFrame(tick); }
requestAnimationFrame(tick); window.__lab = { scene, cam, agents, renderer, fit: () => ({ W, H, scale }) };
// ───────── replay the real job's events (those with a rect act on the page; the rest animate in the HUD)
async function replay() { const j = await (await fetch(JOB)).json(); const ev = (j.result && j.result.events) || []; const seq = ev.filter(e => e.rect && e.rect.w > 20);
  let i = 0; const next = () => { if (!document.getElementById('replay').checked) return setTimeout(next, 800); const e = seq[i % seq.length]; i++; const name = NAMES.includes(e.role) ? e.role : ({ Type: 'Copy', Audit: 'Reader', Photos: 'Visual', Motion: 'UI', QA: 'Contract', Ending: 'UX' })[e.role] || 'UI'; goto(name, e.rect, e.text, 1200); window.scrollTo({ top: Math.max(0, e.rect.y * scale - 260 + page.getBoundingClientRect().top + scrollY), behavior: 'smooth' }); setTimeout(next, 2600 / speed); }; next(); }
shot.addEventListener('load', replay, { once: true });
document.getElementById('mat').onclick = e => { const b = e.target.closest('button'); if (!b) return; matName = b.dataset.m; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); for (const a of Object.values(agents)) a.material = MATS[matName](); };
document.getElementById('spd').onclick = e => { const b = e.target.closest('button'); if (!b) return; speed = +b.dataset.s; [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); };
document.getElementById('light').oninput = e => { light = +e.target.value; key.intensity = 1.6 * light; fill.intensity = .9 * light; };
</script></body></html>
